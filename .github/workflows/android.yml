name: Build APK

on:
  push:
    branches:
      - main
      - Main
    paths:
      - 'web/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy site into app assets
        run: |
          for candidate in logo.png logo.jpg logo.jpeg logo.webp logo.svg; do
            if [ -f "$candidate" ] && [ ! -f "web/$candidate" ]; then cp "$candidate" "web/$candidate"; fi
          done
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r web/. android/app/src/main/assets/www/
          rm -f android/app/src/main/assets/www/.nojekyll
          ls android/app/src/main/assets/www

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/app/release.keystore
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.signing.outputs.signed == 'yes'
        working-directory: android
        env:
          SPOKUM_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SPOKUM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SPOKUM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Build debug APK
        if: steps.signing.outputs.signed == 'no'
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p dist
          if [ "${{ steps.signing.outputs.signed }}" = "yes" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/spokum-latest.apk
            cp android/app/build/outputs/bundle/release/app-release.aab dist/spokum-latest.aab
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/spokum-latest.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: spokum-app
          path: dist/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk dist/* \
            --title "СпокУм для Android" \
            --notes "Версия 1.0.${{ github.run_number }}. ${{ steps.signing.outputs.signed == 'yes' && 'Подписанная сборка для магазина: spokum-latest.apk для установки, spokum-latest.aab для RuStore.' || 'Тестовая сборка. Добавьте ключ подписи в секреты, чтобы собирать релиз.' }}"
