plugins {
  id 'com.android.application'
}

def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
  namespace 'com.spokum.app'
  compileSdk 34

  defaultConfig {
    applicationId "com.spokum.app"
    minSdk 24
    targetSdk 34
    versionCode buildNumber
    versionName "1.0.${buildNumber}"
  }

  signingConfigs {
    release {
      def keystore = file("release.keystore")
      if (keystore.exists()) {
        storeFile keystore
        storePassword System.getenv("SPOKUM_STORE_PASSWORD")
        keyAlias System.getenv("SPOKUM_KEY_ALIAS")
        keyPassword System.getenv("SPOKUM_KEY_PASSWORD")
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      shrinkResources false
      signingConfig file("release.keystore").exists() ? signingConfigs.release : signingConfigs.debug
    }
  }

  packagingOptions {
    resources {
      excludes += ['META-INF/*.version', 'DebugProbesKt.bin']
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.webkit:webkit:1.11.0'
  implementation 'androidx.work:work-runtime:2.9.1'
}
